name: Build Nuvio World TEST APK (space.nuvio.world.test, artifact only)

# APK DE TESTE: pacote separado (space.nuvio.world.test, "Nuvio World Teste"),
# compilacao de RELEASE otimizada (nao debug), ARMv7. Convive com o oficial
# instalado (outro pacote, outros dados) e nao se auto-atualiza. NUNCA publica
# GitHub Release, tag ou latest: o APK e so um artefato do workflow.
on:
  workflow_dispatch:
  push:
    branches:
      - nuvio-world-visual-teste

permissions:
  contents: read

concurrency:
  group: nuvio-world-android-teste-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed Android TV ARMv7 APK (artifact)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      NUVIO_APK_LITE: "1"
      NUVIO_APK_VARIANTE: teste
      NUVIO_REQUIRE_CORE: "1"
      NUVIO_BUILD_JOBS: "2"
      NUVIO_ANDROID_JOBS: "2"
      NUVIO_ANDROID_CACHE: /home/runner/.cache/nuvio-android
      CARGO_HOME: /home/runner/.cargo
      RUSTUP_HOME: /home/runner/.rustup

    steps:
      - name: Checkout Nuvio World
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("deploy/app/appinfo.json"))["version"])')
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Nuvio World version: $VERSION"

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install native build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ffmpeg curl git python3 python3-pil libsdl2-dev \
            pkg-config nasm yasm autoconf automake libtool

      - name: Install Android SDK, NDK and CMake versions
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmake/3.22.1/bin"
          if [ ! -x "$ANDROID_HOME/cmake/3.22.1/bin/ninja" ]; then
            ln -s "$(command -v ninja)" "$ANDROID_HOME/cmake/3.22.1/bin/ninja"
          fi

      - name: Cache Android native dependencies and Rust crates
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.cache/nuvio-android
            /home/runner/.cargo/registry
            /home/runner/.cargo/git
          key: ${{ runner.os }}-nuvio-world-android-release-${{ hashFiles('tools/android/deps.sh', 'tools/android/ffmpeg-android.sh', 'tools/android.sh', 'tools/rust-mkvcore.sh', 'rust/mkvcore/Cargo.lock') }}

      - name: Recover required public build configuration
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/iqui27/nuvio-native-legacy/releases/download/v2.0.8/Nuvio-2.0.8-android-lite-armv7.apk" \
            --output "$RUNNER_TEMP/nuvio-config-source.apk"
          python3 tools/android/extract-config-from-apk.py \
            "$RUNNER_TEMP/nuvio-config-source.apk" --output local.properties

      - name: Prepare World signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/nuvio-world-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          {
            echo "NUVIO_KEYSTORE=$KEYSTORE"
            echo "NUVIO_KEYSTORE_PASS=$ANDROID_KEYSTORE_PASSWORD"
            echo "NUVIO_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "NUVIO_KEY_PASS=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Run Collection parser and paged-data regressions
        run: bash tests/collections.sh

      - name: Run Collection addon identity and Home reconciliation regressions
        run: bash tests/colfileiras_sync.sh

      - name: Run collection parser regression tests
        run: bash tests/colecoes.sh

      - name: Run collection view-mode regression tests
        run: bash tests/colecao_viewmode.sh

      - name: Run collection source-label regression tests
        run: bash tests/vertudo_streamtabs.sh

      - name: Run Vitrine adaptive-columns geometry test
        run: bash tests/vitgeom.sh
      - name: Run Vitrine scroll timing test
        run: bash tests/animtempo.sh
      - name: Run Collections phase 1 guards
        run: bash tests/colecao_fase1.sh
      - name: Run arrow navigation rhythm guards
        run: bash tests/navritmo.sh
      - name: Run Collections row cache tests
        run: bash tests/colcache.sh
      - name: Run local thumbnail (miniatura) tests
        run: bash tests/miniatura_mod.sh
      - name: Run sync no-op Collections reconciliation test
        run: bash tests/sync_colecoes_iguais.sh
      - name: Run poster expansion open/close motion test
        run: bash tests/expansao.sh
      - name: Run 2.0.34 performance guards
        run: bash tests/desempenho_2034.sh
      - name: Run Visual World guards (theme, typography, identity, splash)
        run: bash tests/visual_world.sh
      - name: Run translation tables check
        run: python3 tools/idiomas.py

      - name: Build signed Nuvio World Android TV APK
        run: |
          bash tools/android/deps.sh arm64-v8a armeabi-v7a
          bash tools/android.sh --release-only

      - name: Verify APK signatures and package identity
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          for APK in \
            "build/android/Nuvio-${{ steps.version.outputs.value }}-android-lite-armv7.apk"; do
            test -f "$APK"
            "$BT/apksigner" verify "$APK"
            PACKAGE=$("$BT/aapt" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")
            test "$PACKAGE" = "space.nuvio.world.test"
            "$BT/aapt" dump badging "$APK" | grep -E "^(package|application-label|native-code|sdkVersion)"
            echo "Verified: $APK ($PACKAGE)"
          done

      - name: Name the artifact
        id: ident
        run: |
          BRANCH=$(echo "${GITHUB_REF_NAME}" | sed 's/^nuvio-world-//; s/[^A-Za-z0-9._-]/-/g')
          echo "name=Nuvio-World-TESTE-${{ steps.version.outputs.value }}-${BRANCH}-$(git rev-parse --short=7 HEAD)-ARMv7" >> "$GITHUB_OUTPUT"

      - name: Name the APK file
        run: |
          cp "build/android/Nuvio-${{ steps.version.outputs.value }}-android-lite-armv7.apk" \
             "build/android/${{ steps.ident.outputs.name }}.apk"
          sha256sum "build/android/${{ steps.ident.outputs.name }}.apk"

      - name: Upload TEST APK (no Release)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ident.outputs.name }}
          path: build/android/${{ steps.ident.outputs.name }}.apk
          if-no-files-found: error
          retention-days: 14
