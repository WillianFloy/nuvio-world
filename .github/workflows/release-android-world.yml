name: Publish Nuvio World Android TV ARMv7 Release

# PUBLICACAO MANUAL de um APK que JA foi compilado e testado: este workflow NAO
# compila nada. Ele pega o artefato assinado de uma execucao aprovada de
# "Build signed Nuvio World APK (artifact only, no Release)", confere o arquivo
# e o publica byte a byte como Release, para o atualizador interno do app
# (src/atualizacao.c: /releases/latest, tag vX.Y.Z, anexo *-android-lite-armv7.apk
# com digest sha256).
#
# Sem `publicar` marcado e a confirmacao exata, ele so VERIFICA (dry-run) e nao
# cria tag nem Release. Nao ha gatilho automatico: so workflow_dispatch.

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Versao a publicar, ex.: 2.0.26 (tem de ser a do APK e do appinfo.json)"
        required: true
        type: string
      run_id:
        description: "ID da execucao APROVADA de 'Build signed Nuvio World APK' que gerou o APK"
        required: true
        type: string
      publicar:
        description: "Desmarcado = so verifica (nao publica). Marcado = publica a Release"
        required: true
        type: boolean
        default: false
      confirmacao:
        description: "Para publicar, digite exatamente: PUBLICAR v<versao> (ex.: PUBLICAR v2.0.26)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: nuvio-world-android-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish the already-tested signed APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      VERSAO: ${{ inputs.versao }}
      RUN_ID: ${{ inputs.run_id }}
      PUBLICAR: ${{ inputs.publicar }}
      CONFIRMACAO: ${{ inputs.confirmacao }}
    steps:
      - name: Checkout (notes and workflow only; nothing is built)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate inputs, confirmation and tag block
        run: |
          set -euo pipefail
          [[ "$VERSAO" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::versao invalida: $VERSAO"; exit 1; }
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::run_id invalido"; exit 1; }
          if [ "$PUBLICAR" = "true" ] && [ "$CONFIRMACAO" != "PUBLICAR v$VERSAO" ]; then
            echo "::error::confirmacao incorreta: para publicar digite exatamente 'PUBLICAR v$VERSAO'"; exit 1
          fi
          # Tag ja existente (remota) ou Release ja existente (inclusive rascunho): BLOQUEIA.
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$VERSAO")" ]; then
            echo "::error::a tag v$VERSAO ja existe; este workflow nunca sobrescreve Releases"; exit 1
          fi
          if gh release view "v$VERSAO" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::ja existe Release v$VERSAO; este workflow nunca sobrescreve Releases"; exit 1
          fi
          test -f "deploy/release-notes/$VERSAO.md" || { echo "::error::faltam as notas deploy/release-notes/$VERSAO.md"; exit 1; }
          echo "Entradas ok: versao=$VERSAO run_id=$RUN_ID publicar=$PUBLICAR"

      - name: Verify the source build run (approved, same repo, same commit as the version)
        id: fonte
        run: |
          set -euo pipefail
          R=$(gh api "repos/$REPO/actions/runs/$RUN_ID")
          [ "$(jq -r .path <<<"$R")" = ".github/workflows/build-android-world-signed.yml" ] || { echo "::error::a execucao nao e do build assinado"; exit 1; }
          [ "$(jq -r .status <<<"$R")" = "completed" ] && [ "$(jq -r .conclusion <<<"$R")" = "success" ] || { echo "::error::a execucao de build nao terminou com sucesso"; exit 1; }
          [ "$(jq -r .head_repository.full_name <<<"$R")" = "$REPO" ] || { echo "::error::a execucao nao e deste repositorio"; exit 1; }
          SHA=$(jq -r .head_sha <<<"$R")
          git cat-file -e "$SHA^{commit}" || { echo "::error::commit $SHA ausente"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          # A versao do codigo que gerou o APK (as duas fontes, que o build exige iguais).
          V1=$(git show "$SHA:deploy/app/appinfo.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          V2=$(git show "$SHA:tools/tizen-config.xml" | sed -n 's/.*version="\([0-9.]*\)".*/\1/p' | head -1)
          [ "$V1" = "$VERSAO" ] && [ "$V2" = "$VERSAO" ] || { echo "::error::versao no commit do build: appinfo=$V1 tizen=$V2, pedida=$VERSAO"; exit 1; }
          # O commit tagueado e o do build. Este checkout so pode diferir dele em workflow/notas.
          BAD=$(git diff --name-only "$SHA" HEAD | grep -vE '^(\.github/|deploy/release-notes/|tests/release_promocao\.sh$)' || true)
          [ -z "$BAD" ] || { echo "::error::o checkout difere do commit do build em arquivos de codigo:"; echo "$BAD"; exit 1; }
          # Os testes de regressao tambem passaram nesse mesmo commit.
          N=$(gh run list --repo "$REPO" --workflow collections-regression.yml --commit "$SHA" --status success --json databaseId --jq length)
          [ "$N" -ge 1 ] || { echo "::error::sem execucao verde de collections-regression para $SHA"; exit 1; }
          echo "Build $RUN_ID aprovado, commit $SHA, regressao verde."

      - name: Download the signed artifact of that run (no rebuild)
        id: baixar
        run: |
          set -euo pipefail
          SHA7=$(cut -c1-7 <<<"${{ steps.fonte.outputs.sha }}")
          A=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --jq "[.artifacts[]|select(.expired==false and (.name|endswith(\"-$SHA7-SIGNED-ARMv7\")))]")
          [ "$(jq length <<<"$A")" = "1" ] || { echo "::error::esperava exatamente 1 artefato assinado valido (nao expirado) do run"; jq -r '.[].name' <<<"$A"; exit 1; }
          NOME=$(jq -r '.[0].name' <<<"$A")
          mkdir -p "$RUNNER_TEMP/apk"
          gh run download "$RUN_ID" --repo "$REPO" -n "$NOME" -D "$RUNNER_TEMP/apk"
          [ "$(find "$RUNNER_TEMP/apk" -type f | wc -l)" = "1" ] || { echo "::error::o artefato deve ter exatamente 1 arquivo"; find "$RUNNER_TEMP/apk" -type f; exit 1; }
          APK="$RUNNER_TEMP/apk/Nuvio-$VERSAO-android-lite-armv7.apk"
          test -f "$APK" || { echo "::error::nome do APK diferente do que o atualizador procura"; find "$RUNNER_TEMP/apk" -type f; exit 1; }
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Set up Android build-tools (verification only)
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "build-tools;35.0.0" >/dev/null
          echo "BT=$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_ENV"

      - name: Verify signature, identity, ABI, versionCode and certificate continuity
        run: |
          set -euo pipefail
          APK="${{ steps.baixar.outputs.apk }}"
          "$BT/apksigner" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          NOVO=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt")
          [ -n "$NOVO" ]
          B=$("$BT/aapt" dump badging "$APK")
          PKG=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<<"$B")
          VN=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$B" | head -1)
          VC=$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<<"$B" | head -1)
          IFS=. read -r X Y Z <<<"$VERSAO"
          [ "$PKG" = "space.nuvio.world" ] || { echo "::error::pacote $PKG"; exit 1; }
          [ "$VN" = "$VERSAO" ] || { echo "::error::versionName $VN"; exit 1; }
          [ "$VC" = "$((X*10000 + Y*100 + Z))" ] || { echo "::error::versionCode $VC"; exit 1; }
          grep -q "native-code: 'armeabi-v7a'" <<<"$B" || { echo "::error::sem ABI armeabi-v7a"; exit 1; }
          if grep -q "arm64-v8a" <<<"$B"; then echo "::error::APK contem arm64"; exit 1; fi
          # Continuidade: o Android so atualiza por cima com o MESMO certificado. Compara com
          # o APK da Release mais recente ja publicada.
          ANT=$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')
          mkdir -p "$RUNNER_TEMP/ant"
          gh release download "$ANT" --repo "$REPO" -p '*-android-lite-armv7.apk' -D "$RUNNER_TEMP/ant"
          ANTAPK=$(ls "$RUNNER_TEMP/ant"/*.apk)
          VELHO=$("$BT/apksigner" verify --print-certs "$ANTAPK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          [ "$NOVO" = "$VELHO" ] || { echo "::error::certificado DIFERENTE do da Release $ANT: a TV recusaria a atualizacao"; exit 1; }
          echo "Certificado igual ao da Release $ANT: $NOVO"
          echo "package=$PKG versionName=$VN versionCode=$VC abi=armeabi-v7a"

      - name: Check the release notes parse the way the in-app card needs
        run: |
          set -euo pipefail
          F="deploy/release-notes/$VERSAO.md"
          ! grep -q '^---' "$F" || { echo "::error::'---' corta as notas no app"; exit 1; }
          ! grep -qiE '^#+ *(Notes|Notas)' "$F" || { echo "::error::cabecalho Notes/Notas corta as notas no app"; exit 1; }
          [ "$(wc -c < "$F")" -lt 3000 ] || { echo "::error::notas longas demais para o cartao"; exit 1; }
          cat "$F"

      - name: Summary (what would be published)
        run: |
          {
            echo "## Release v$VERSAO"
            echo "- Modo: $([ "$PUBLICAR" = "true" ] && echo PUBLICA || echo 'VERIFICACAO (nada sera publicado)')"
            echo "- Build de origem: run $RUN_ID, commit \`${{ steps.fonte.outputs.sha }}\`"
            echo "- Arquivo: \`$(basename "${{ steps.baixar.outputs.apk }}")\`"
            echo "- sha256 do arquivo: \`${{ steps.baixar.outputs.sha256 }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the GitHub Release (only if requested and confirmed)
        if: ${{ inputs.publicar }}
        run: |
          set -euo pipefail
          gh release create "v$VERSAO" "${{ steps.baixar.outputs.apk }}" \
            --repo "$REPO" \
            --target "${{ steps.fonte.outputs.sha }}" \
            --title "Nuvio World v$VERSAO" \
            --notes-file "deploy/release-notes/$VERSAO.md" \
            --latest

      - name: Verify what the in-app updater will see
        if: ${{ inputs.publicar }}
        run: |
          set -euo pipefail
          sleep 10
          L=$(gh api "repos/$REPO/releases/latest")
          python3 -c '
          import json,sys
          v,sha=sys.argv[1],sys.argv[2]
          r=json.loads(sys.stdin.read())
          assert r["tag_name"]=="v"+v, r["tag_name"]
          assert not r["draft"] and not r["prerelease"]
          suf="-android-lite-armv7.apk"
          a=[x for x in r["assets"] if x["name"].endswith(suf)]
          assert len(a)==1 and a[0]["name"]=="Nuvio-%s-android-lite-armv7.apk"%v, a
          assert a[0].get("digest")=="sha256:"+sha, (a[0].get("digest"), sha)
          print("OK: o atualizador vera", r["tag_name"], a[0]["name"], a[0]["digest"])
          ' "$VERSAO" "${{ steps.baixar.outputs.sha256 }}" <<<"$L"
